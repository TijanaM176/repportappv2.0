<div class="reports-wrapper">
  <aside class="sidebar-modern" [class.expanded]="sidebarOpen">
    <button class="sidebar-toggle-btn" (click)="toggleSidebar()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
      <span class="toggle-label" *ngIf="sidebarOpen">Filters</span>
    </button>
    
    <div class="sidebar-scroll" *ngIf="sidebarOpen">
      
   <div class="filter-card">
      <div class="filter-header">
        <label class="filter-label">Production Line</label>
      </div>
      <p-cascadeSelect
      [options]="groupedLines"
      optionLabel="name"
      optionGroupLabel="name"
      [optionGroupChildren]="['children']"
      (onChange)="onProductionLineChange($event)"
      placeholder="Select Production Line"
      appendTo="body">
    </p-cascadeSelect>
    </div>

      <div class="filter-card">
        <div class="filter-header">
          <label class="filter-label">Time Range</label>
        </div>
        <p-select 
          [options]="timeDropDown" 
          [(ngModel)]="selectedTime" 
          optionLabel="title"
          (onChange)="onTimeChange()"
          styleClass="custom-input"
          appendTo="body"
        ></p-select>
      </div>

      <div class="filter-card">
        <div class="filter-header">
          <label class="filter-label">Start Date & Time</label>
        </div>
        <p-datepicker
          inputId="calendar-24h-1"
          [(ngModel)]="datetime24h1"
          [showTime]="true"
          [hourFormat]="'24'"
          placeholder="Select start"
          [disabled]="!isSelected"
          dateFormat="yy-m-d"
          styleClass="custom-input"
          appendTo="body"
        ></p-datepicker>
      </div>

      <div class="filter-card">
        <div class="filter-header">
          <label class="filter-label">End Date & Time</label>
        </div>
        <p-datepicker
          inputId="calendar-24h-2"
          [(ngModel)]="datetime24h2"
          [showTime]="true"
          [hourFormat]="'24'"
          placeholder="Select end"
          [disabled]="!isSelected"
          dateFormat="yy-m-d"
          styleClass="custom-input"
          appendTo="body"
        ></p-datepicker>
      </div>

      <div class="action-group">
        <button class="btn-modern btn-outline" 
          [disabled]="!showPopupReport" 
          (click)="showDialog()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          <span>Select Reports</span>
        </button>

        <button class="btn-modern btn-primary" (click)="getData()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
          <span>Get Data</span>
        </button>
      </div>

    </div>
  </aside>

  <main class="content-modern" [class.sidebar-expanded]="sidebarOpen">
    <div *ngIf="show">

      <div *ngIf="show2" class="modern-card chart-card-modern">
        <div class="card-header-modern" (click)="toggleChart()">
          <div class="header-left">
            <div class="icon-badge" [class.active]="showChart">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="20" x2="12" y2="10"></line>
                <line x1="18" y1="20" x2="18" y2="4"></line>
                <line x1="6" y1="20" x2="6" y2="16"></line>
              </svg>
            </div>
            <h3 class="card-title">Analytics Dashboard</h3>
            <span class="badge-live" *ngIf="showChart">LIVE</span>
          </div>
          <div class="header-right">
            <span class="expand-text">{{ showChart ? 'Collapse' : 'Expand' }}</span>
            <div class="chevron" [class.rotated]="showChart">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </div>
          </div>
        </div>
        
        <div class="card-body-modern" *ngIf="showChart" [@fadeInOut]>
          <!--<app-chart
            [selectedProductionLine]="selectedProductionLine"
            [startDate]="datetime24h1"
            [endDate]="datetime24h2"
            [allReportOptions]="reportOptions">
          </app-chart>-->
        </div>
      </div>

      <!-- Reports Container -->
      <div class="reports-container-modern">
       <!-- <app-production-report *ngIf="showPR" [selectedProductionLine]="selectedProductionLine" [startDate]="formattedDateTime(datetime24h1)" [endDate]="formattedDateTime(datetime24h2)" [allReportOptions]="reportOptions"></app-production-report>

        <app-packaging-station-report *ngIf="showPSR" [selectedProductionLine]="selectedProductionLine" [startDate]="formattedDateTime(datetime24h1)" [endDate]="formattedDateTime(datetime24h2)" [allReportOptions]="reportOptions"></app-packaging-station-report>

        <app-manufactured-parts-report *ngIf="showMPR" [selectedProductionLine]="selectedProductionLine" [startDate]="formattedDateTime(datetime24h1)" [endDate]="formattedDateTime(datetime24h2)" [allReportOptions]="reportOptions" [datetime24]="datetime24"></app-manufactured-parts-report>

        <app-rework-report *ngIf="showRR" [selectedProductionLine]="selectedProductionLine" [startDate]="formattedDateTime(datetime24h1)" [endDate]="formattedDateTime(datetime24h2)" [allReportOptions]="reportOptions"></app-rework-report>

        <app-scrap-report *ngIf="showScrap" [selectedProductionLine]="selectedProductionLine" [startDate]="formattedDateTime(datetime24h1)" [endDate]="formattedDateTime(datetime24h2)" [allReportOptions]="reportOptions"></app-scrap-report>

        <app-employee-efficiency-report *ngIf="showEER" [selectedProductionLine]="selectedProductionLine" [startDate]="formattedDateTime(datetime24h1)" [endDate]="formattedDateTime(datetime24h2)" [allReportOptions]="reportOptions"></app-employee-efficiency-report>

        <app-production-planning-report *ngIf="showPPR" [selectedProductionLine]="selectedProductionLine" [startDate]="formattedDateTime(datetime24h1)" [endDate]="formattedDateTime(datetime24h2)" [allReportOptions]="reportOptions"></app-production-planning-report>

        <app-production-target-report *ngIf="showPTR" [selectedProductionLine]="selectedProductionLine" [startDate]="formattedDateTime(datetime24h1)" [endDate]="formattedDateTime(datetime24h2)" [allReportOptions]="reportOptions"></app-production-target-report>
    -->  
    </div>
    </div>
  </main>
</div>

<p-dialog
  header="Select Reports"
  [modal]="true"
  [(visible)]="visible"
  [style]="{ width: '600px', 'max-width': '90vw' }"
  styleClass="reports-dialog"
  appendTo="body">
  
  <div class="dialog-content-grid">
    <div *ngFor="let report of reportOptions" class="report-toggle-item">
      <p-selectButton 
        [(ngModel)]="report.selectedValue"
        [options]="[{ name: report.name, value: true }]"  
        optionLabel="name"
        optionValue="value"
        (onChange)="reportChange(report)">
      </p-selectButton>
    </div>
  </div>
  
  <ng-template pTemplate="footer">
    <div class="dialog-actions">
      <p-button label="Cancel" [text]="true" severity="secondary" (onClick)="visible = false"></p-button>
      <p-button label="Apply" icon="pi pi-check" (onClick)="funkcija()"></p-button>
    </div>
  </ng-template>
</p-dialog>
